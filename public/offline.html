<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b2c56">
    <title>Offline · GIC Folks CRM</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f3f5f9; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #334155; padding: 16px; box-sizing: border-box; }
        .card { max-width: 380px; text-align: center; background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 8px 30px rgba(11, 44, 86, .08); }
        img { width: 72px; height: 72px; }
        h1 { font-size: 20px; color: #0b2c56; margin: 16px 0 6px; }
        p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; }
        button { background: #0b2c56; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/pwa-192.png" alt="">
        <h1>You're offline</h1>
        <p>GIC Folks CRM needs the internet to load your work. Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
